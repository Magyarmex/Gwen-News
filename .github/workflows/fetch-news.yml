name: Fetch News

on:
  schedule:
    - cron: '0 * * * *'   # every hour on the hour
  workflow_dispatch:        # manual trigger from GitHub Actions tab
  push:
    branches: [main]
    paths:
      - 'fetch_news.py'     # re-run when the script itself changes

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch and build news.json
        run: python fetch_news.py

      - name: Commit news.json if changed
        run: |
          git config user.name  "gwen-news-bot"
          git config user.email "gwen@gwennews.mx"
          git add news.json
          git diff --staged --quiet || git commit -m "chore: update news.json [skip ci]"
          git pull --rebase origin main
          git push
